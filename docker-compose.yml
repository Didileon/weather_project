services:
  backend:
    build:
      context: ./weather_project
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./weather_project:/app
    ports:
      - "8000:8000"
    env_file:
      - ./weather_project/.env
    depends_on:
      - db

  frontend:
    build:
      context: ./weather-frontend
    volumes:
      - ./weather-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    env_file:
      - ./weather-frontend/.env

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: weatherdb
      POSTGRES_USER: weatheruser
      POSTGRES_PASSWORD: weatherpass

volumes:
  postgres_data:
